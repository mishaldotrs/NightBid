name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: Contract — compile & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Compact toolchain
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf https://github.com/midnightntwrk/compact/releases/latest/download/compact-installer.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Pin Compact compiler
        # 0.31.1 targets compact-runtime 0.16.0, matching Midnight.js 4.x.
        run: compact update 0.31.1 && compact compile --version

      - name: Install dependencies
        run: npm ci

      - name: Compile Compact contract (ZK circuits + keys)
        run: npm run compact --workspace contract

      - name: Typecheck contract bindings
        run: npm run typecheck --workspace contract

      - name: Run contract tests
        run: npm test --workspace contract

  client:
    name: Client — typecheck, test & build
    runs-on: ubuntu-latest
    needs: contract
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck client
        run: npm run typecheck --workspace client

      - name: Run client tests
        run: npm test --workspace client

      - name: Build client (production bundle + ZK artifacts)
        run: npm run build --workspace client

      - uses: actions/upload-artifact@v4
        with:
          name: nightbid-client-dist
          path: client/dist
          retention-days: 7
