name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: Contract — compile & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Compact toolchain
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf https://github.com/midnightntwrk/compact/releases/latest/download/compact-installer.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Pin Compact compiler
        run: compact update 0.35.0 && compact compile --version

      - name: Install dependencies
        run: npm ci

      - name: Compile Compact contract (ZK circuits + keys)
        run: npm run compact --workspace contract

      - name: Typecheck contract bindings
        run: npm run typecheck --workspace contract

      - name: Run contract tests
        run: npm test --workspace contract

  client:
    name: Client — lint, typecheck & build
    runs-on: ubuntu-latest
    needs: contract
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck client
        run: npm run typecheck --workspace client

      - name: Build client
        run: npm run build --workspace client
