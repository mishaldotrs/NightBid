# Local Midnight proof server. Lace requires it to prove transactions
# (sending tokens, DUST designation, and every NightBid circuit call).
#   docker compose up -d      → http://localhost:6300/health
# (Without the compose plugin, use `npm run proof-server` instead.)
services:
  proof-server:
    image: midnightntwrk/proof-server:8.1.0 # matches ledger v8 / Midnight.js 4.x
    container_name: midnight-proof-server
    ports:
      - "6300:6300"
    environment:
      PORT: "6300"
    restart: unless-stopped
